# «Проверки PR» — Этап 2, И1 (18.11.2026): на каждый Pull Request в main сами запускаются все автотесты
# и снимаются скриншоты экранов (390/360 px, тёмная и светлая тема, только демо-данные).
# Без интернета для приложения: Supabase и цены — имитация (tests/mock-supabase.js). Секреты не нужны.
# Итог — зелёная или красная галочка у PR; скриншоты и снимки тестов — файлами к запуску («Artifacts»).
name: Проверки PR
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Автотесты и скриншоты
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Браузер для тестов
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji >/dev/null || true
      - name: Автотесты (python3 tests/run_tests.py)
        shell: bash   # с pipefail: красные тесты = красная галочка, несмотря на tee
        run: python3 tests/run_tests.py 2>&1 | tee tests-result.txt
      - name: Скриншоты экранов (tools/screens.py)
        if: always()
        run: python3 tools/screens.py screens-pr || echo "скриншоты не сняты"
      - name: Итог одной строкой
        if: always()
        run: |
          echo "### Проверки PR" >> "$GITHUB_STEP_SUMMARY"
          grep -E "ИТОГ|✗" tests-result.txt | head -40 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Скриншоты и снимки тестов — файлами к запуску
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.event.pull_request.number || 'run' }}
          path: |
            screens-pr/
            tests/out/
            tests-result.txt
          retention-days: 14
