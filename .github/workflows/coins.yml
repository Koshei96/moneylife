# Еженедельное обновление справочника монет CoinGecko (data/coins*.json) для поиска в приложении.
# Если CoinGecko отдал неполный список — справочник не меняется (защита в tools/build_coins.py).
name: coins-weekly
on:
  schedule:
    - cron: '17 2 * * 1'      # понедельник, 02:17 UTC (05:17 по Киеву)
  workflow_dispatch:
  push:                       # и сразу после правки самого скрипта или этой задачи
    branches: [main]
    paths: ['tools/build_coins.py', '.github/workflows/coins.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: coins
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_coins.py
      - name: Сохранить, если справочник изменился
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A data
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Справочник монет CoinGecko: еженедельное обновление"
          git pull -q --rebase
          git push
          # пересобрать сайт GitHub Pages (на случай, если пуш от бота сам этого не сделает)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
